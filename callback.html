<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Passport Car 授权</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f6f6f4; color: #222; }
  main { max-width: 560px; margin: 0 auto; }
  code { display: block; word-break: break-all; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 15px; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; border: 0; border-radius: 8px; background: #3e6ae1; color: #fff; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1>Passport Car 授权</h1>
  <div id="out">正在读取…</div>
</main>
<script>
  // Shows the OAuth result locally only: no requests, no third-party scripts.
  const q = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  const code = q.get("code");
  if (code) {
    out.innerHTML = '<p>授权成功。把下面这串授权码复制给 Claude(几分钟内有效,只能用一次):</p>' +
      '<code id="c"></code><button id="b">复制授权码</button>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = async () => {
      await navigator.clipboard.writeText(code);
      document.getElementById("b").textContent = "已复制";
    };
  } else if (q.get("error")) {
    out.innerHTML = '<p class="err"></p>';
    out.firstChild.textContent = "授权失败:" + q.get("error") + " " + (q.get("error_description") || "");
  } else {
    out.textContent = "这里是授权回调页,没有收到授权码。";
  }
</script>
</body>
</html>
